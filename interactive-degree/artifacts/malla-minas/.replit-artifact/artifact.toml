kind = "web"
previewPath = "/"
title = "Malla Ingeniería Civil de Minas"
version = "1.0.0"
id = "artifacts/malla-minas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20364
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/malla-minas run dev"

[services.env]
PORT = "20364"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/malla-minas", "run", "build"]
publicDir = "artifacts/malla-minas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
